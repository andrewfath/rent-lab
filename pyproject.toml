[project]
name = "rent-lab"
version = "0.1.0"
description = "Chicago rent-estimate model and rental investment screener"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.11,<2",
    "dbt-duckdb>=1.11,<2",
    "duckdb>=1.4,<3",
    "pyarrow>=18",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.15",
]

[project.scripts]
rentlab = "rentlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rentlab"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dbt: runs the dbt project against fixture data (slower)"]
