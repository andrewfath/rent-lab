version: 2

models:
  - name: stg_chicago_portal__cta_l_stops
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: lat
        data_tests:
          - not_null
          - within_market_bbox
  - name: stg_chicago_portal__building_permits
    columns:
      - name: permit_id
        data_tests: [unique, not_null]
  - name: stg_chicago_portal__crimes
    columns:
      - name: crime_id
        data_tests: [unique, not_null]
